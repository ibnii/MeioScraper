<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#F2EBDD">
  <meta name="robots" content="noindex">
  <title>Membaca — Novelin</title>
  <script>
    (function () {
      try {
        var saved = localStorage.getItem("novelin:theme");
        var dark = saved ? saved === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      } catch (error) {}
    })();
  </script>
  <link rel="preload" href="/static/fonts/spectral-600.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/static/fonts/public-sans-var.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/static/css/tokens.css">
  <link rel="stylesheet" href="/static/css/controls.css">
  <link rel="stylesheet" href="/static/css/feedback.css">
  <link rel="stylesheet" href="/static/css/reader.css">
  <link rel="stylesheet" href="/static/css/responsive.css">
  <link rel="stylesheet" href="/static/css/theme.css">
</head>
<body>
  <a class="skip-link" href="#reader-body">Lewati ke isi chapter</a>

  <main id="reader" class="reader" data-reader-theme="paper" aria-labelledby="reader-title">
    <article class="reader__sheet">
      <header class="reader__head">
        <div class="reader__identity">
          <p id="reader-novel" class="reader__novel"></p>
          <h1 id="reader-title" class="reader__title">Memuat chapter…</h1>
          <a id="reader-source" class="reader__source" href="#" target="_blank" rel="noreferrer">Buka di sumber</a>
          <p class="reader__hint">Klik area baca untuk menyembunyikan kontrol</p>
        </div>
        <div class="reader__tools">
          <div class="reader__sizes" role="group" aria-label="Ukuran huruf">
            <button type="button" data-reader-size="-1" aria-label="Perkecil huruf">A−</button>
            <button type="button" data-reader-size="1" aria-label="Perbesar huruf">A+</button>
          </div>
          <div class="reader__themes" role="group" aria-label="Tema baca">
            <button type="button" data-reader-theme="paper" aria-pressed="true">Kertas</button>
            <button type="button" data-reader-theme="sepia" aria-pressed="false">Sepia</button>
            <button type="button" data-reader-theme="night" aria-pressed="false">Malam</button>
          </div>
          <a id="reader-close" class="reader__close" href="/" aria-label="Kembali ke daftar chapter">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="m5 5 10 10M15 5 5 15" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          </a>
        </div>
      </header>

      <div class="reader__progress" aria-hidden="true">
        <span id="reader-progress-fill"></span>
      </div>

      <div id="reader-body" class="reader__body" tabindex="0"
           aria-label="Area baca. Klik untuk menyembunyikan atau menampilkan kontrol.">
        <div id="reader-loading" class="reader__loading" hidden>
          <div class="skeleton skeleton--title"></div>
          <div class="skeleton skeleton--body"></div>
          <div class="skeleton skeleton--body"></div>
          <div class="skeleton skeleton--body-short"></div>
          <div class="skeleton skeleton--body"></div>
          <div class="skeleton skeleton--body-short"></div>
        </div>

        <div id="reader-content" class="reader__content" hidden></div>

        <div id="reader-gate" class="reader__gate" hidden>
          <span class="reader__gate-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="10" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M8.5 10V7.5a3.5 3.5 0 0 1 7 0V10" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
          </span>
          <strong>Chapter terkunci</strong>
          <p id="reader-gate-message">Chapter ini membutuhkan akses akun.</p>
          <form id="reader-cookie-form" class="reader__gate-form">
            <label class="sr-only" for="reader-cookie">Cookie sesi akun</label>
            <input id="reader-cookie" type="password" autocomplete="off" spellcheck="false"
                   placeholder="wordpress_logged_in_...">
            <button class="btn btn--primary" type="submit">Buka dengan cookie</button>
          </form>
          <p class="reader__gate-hint">Cookie hanya disimpan di memori tab ini.</p>
        </div>

        <div id="reader-error" class="reader__error" hidden>
          <strong>Chapter gagal dimuat.</strong>
          <p id="reader-error-message"></p>
          <button id="reader-retry" class="btn btn--ghost" type="button">Coba lagi</button>
        </div>
      </div>

      <footer class="reader__foot">
        <a id="reader-prev" class="reader__nav" aria-disabled="true">← Sebelumnya</a>
        <span id="reader-position" class="reader__position"></span>
        <a id="reader-next" class="reader__nav" aria-disabled="true">Berikutnya →</a>
      </footer>
    </article>
  </main>

  <p id="reader-status" class="sr-only" role="status" aria-live="polite"></p>

  <script>window.NOVELIN_READER = {{ reader_config|tojson }};</script>
  <script type="module" src="/static/js/reader.js"></script>
</body>
</html>
